# Build the CachyOS bootc OCI image from Container.server.
#
# Pull requests (main, develop): build only (verify the image builds).
# Push to develop: build and push to GHCR.
#
# Runner requirement: x86-64-v3 (AVX2). CachyOS v3 images require this.
# GitHub's ubuntu-latest runners are x86-64-v3.

name: Build bootc image

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  IMAGE_NAME: ghcr.io/jopfrag/rogue-server
  IMAGE_TAG: v1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install podman
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Compute image date tag
        id: meta
        run: |
          set -euo pipefail
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build image
        # Secrets are passed straight from the environment via type=env and
        # never written to disk on the runner.
        env:
          DB_KEY: ${{ secrets.DB_KEY }}
          PCR_KEY: ${{ secrets.PCR_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DB_KEY:-}" ] || [ -z "${PCR_KEY:-}" ]; then
            echo "::error::The build always signs for Secure Boot and embeds a TPM2 PCR policy; repository secrets DB_KEY and PCR_KEY are required."
            exit 1
          fi
          podman build \
            --build-arg SIGNING_REV="${GITHUB_SHA}" \
            --secret id=db_key,type=env,env=DB_KEY \
            --secret id=pcr_key,type=env,env=PCR_KEY \
            --tag "${IMAGE_NAME}:${{ steps.meta.outputs.date }}" \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            --tag "${IMAGE_NAME}:latest" \
            -f Container.server .

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | podman login ghcr.io \
            --username "${GH_ACTOR}" \
            --password-stdin

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          set -euo pipefail
          podman push "${IMAGE_NAME}:${{ steps.meta.outputs.date }}"
          podman push "${IMAGE_NAME}:${IMAGE_TAG}"
          podman push "${IMAGE_NAME}:latest"
